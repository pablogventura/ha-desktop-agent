device:
  name: desktop
  # id: null  # default: first 12 chars of /etc/machine-id

mqtt:
  host: homeassistant.local
  port: 1883
  username: null
  password: null
  tls: false
  discovery_prefix: homeassistant
  topic_prefix: ha-desktop

poll:
  fast_ms: 2000
  slow_ms: 10000
  idle_threshold_s: 60
  force_publish_s: 60

sensors:
  gpu: true
  estimated_power: true
  active_application: true
  active_window_title: false
  tailscale: true
  wireguard: true
  lan_ip: true
  disk: true
  battery: true
  wifi: true
  online: true
  audio: true
  mpris: false
  dnd: true
  disabled: []

processes:
  - id: discord
    match: discord
  - id: ollama
    match: ollama

listeners:
  - id: ssh
    port: 22
  - id: vnc
    port: 5900
  - id: rdp
    port: 3389

actions:
  lock: true
  suspend: true
  hibernate: false
  shutdown: false
  reboot: false
  caffeine: true
  mute: true
  volume: true
  notify: true
  dnd: true

# Only argv registered here can be executed. Never interpolated from MQTT.
commands: []

notify:
  # Default title for notify_message / notify_urgent when the MQTT payload has none.
  title: Desktop
  # Used when the MQTT message is empty.
  body: Notification from ha-desktop-agent
# - id: start_ollama
#   name: Start Ollama
#   argv: ["/usr/bin/systemctl", "--user", "start", "ollama"]

power:
  idle_w: 30
  coefficients:
    cpu_package_w: 1.0
    dram_w: 1.0
    gpu_w: 1.0
    cpu_usage: 0.0
    gpu_usage: 0.0
  log_csv: null
