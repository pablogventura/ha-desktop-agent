[package]
name = "ha-desktop-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop telemetry and control agent for Home Assistant via MQTT Discovery"
repository = ""
readme = "README.md"
keywords = ["home-assistant", "mqtt", "desktop"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nvml-wrapper = "0.11"
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
if-addrs = "0.13"

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
